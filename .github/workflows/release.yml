name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  GO_VERSION: '1.26.4'
  GORELEASER_VERSION: 'v2.8.2'
  COSIGN_VERSION: 'v3.8.1'
  SYFT_VERSION: 'v1.18.1'
  GOVULNCHECK_VERSION: 'v1.25.0'

jobs:
  verify:
    name: mandatory-release-verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Install mandatory pinned govulncheck
        run: |
          set -euxo pipefail
          GOBIN="$RUNNER_TEMP/bin" GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          "$RUNNER_TEMP/bin/govulncheck" ./...
      - name: Vet, race, integration, and compatibility
        run: |
          set -euxo pipefail
          go vet ./...
          go test -race ./...
          go test -race ./test/integration/...
          go test -race -tags compat ./test/compatibility
      - name: Strict performance and 10k soak/leak (no skip path)
        env:
          KORDN_STRICT_PERFORMANCE: '1'
          KORDN_SOAK: '1'
        run: |
          set -euxo pipefail
          make strict-performance
          make strict-compatibility
          make soak-leak
          make soak-leak-race
      - name: Fuzz smoke
        run: make fuzz-smoke
      - name: Secret scan
        run: |
          set -euxo pipefail
          if grep -R -n -E 'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}' --exclude-dir=.git --exclude='*.json' .; then
            echo 'credential pattern found' >&2
            exit 1
          fi
          if grep -R -n -E 'BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY' --exclude-dir=.git .; then
            echo 'private key pattern found' >&2
            exit 1
          fi
      - name: License, mapper, checklist, and release snapshot gates
        run: |
          set -euxo pipefail
          make license-check
          make checklist-validation
          go test ./internal/iammap -run 'Test(GoldenMappings|NoScopeWidening|DependentPassRole)' -count=1
          make release-snapshot
          rm -rf dist/release-snapshot .release-snapshot-a .release-snapshot-b

  build-and-publish:
    name: build-sign-attest-publish
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      - name: Install pinned Syft
        uses: anchore/sbom-action/download@da167eac915b4e86f08b264dbdbc867b61be6f0c # v0.20.5
        with:
          syft-version: ${{ env.SYFT_VERSION }}
      - name: Build archives with GoReleaser without publishing
        uses: goreleaser/goreleaser-action@90a3faa9d0182683851fbfa97ca1a2cb983bfca3 # v6.2.1
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --skip=publish --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@fb28c2b6339dcd94da6e4cbcbc5e888961f6f8c3 # v3.9.0
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Generate and sign release metadata
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euxo pipefail
          test -s dist/SHA256SUMS
          printf '%s\n' '{"format":"kordn.provenance/v1","builder":"goreleaser","commit":"'"$GITHUB_SHA"'"}' > dist/provenance.json
          printf '%s\n' 'Apache-2.0 project; reviewed third-party notices are included in each archive.' > dist/LICENSE-REPORT.txt
          shopt -s nullglob
          sbom_files=(dist/*.sbom.json)
          test "${#sbom_files[@]}" -gt 0
          for file in "${sbom_files[@]}"; do
            test -s "$file"
          done
          sbom_names=("${sbom_files[@]#dist/}")
          (cd dist && sha256sum *.tar.gz SHA256SUMS "${sbom_names[@]}" provenance.json LICENSE-REPORT.txt > RELEASE-METADATA-SHA256SUMS)
          for file in dist/*.tar.gz dist/SHA256SUMS dist/*.sbom.json dist/provenance.json dist/LICENSE-REPORT.txt dist/RELEASE-METADATA-SHA256SUMS; do
            test -s "$file"
            cosign sign-blob --yes --output-signature "${file}.sig" --output-certificate "${file}.pem" "$file"
            cosign verify-blob --signature "${file}.sig" --certificate "${file}.pem" --certificate-identity-regexp 'https://github.com/.*/.github/workflows/.*' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' "$file"
          done
      - name: Attest archive subjects with GitHub build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: 'dist/*.tar.gz'
      - name: Upload complete release set
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
