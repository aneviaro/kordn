name: ci

on:
  # Feature branches are covered by pull_request. Restrict push runs to main
  # so updating an open PR does not start a duplicate CI run.
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: '1.26.4'
  AWSCLI_VERSION: '2.27.50'
  TERRAFORM_VERSION: '1.12.2'
  AWS_PROVIDER_VERSION: '6.0.0'
  PYTHON_VERSION: '3.12'
  BOTO3_VERSION: '1.39.9'
  CLAUDE_VERSION: '2.0.0'

jobs:
  pure:
    name: pure-ubuntu-latest-amd64
    runs-on: ubuntu-latest
    env:
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      # Make's verification targets are intentionally offline. Download the
      # build dependencies, then cache the full module graph metadata needed by
      # the license gate without downloading unrelated source archives.
      - name: Download Go modules
        run: |
          set -euxo pipefail
          GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go mod download
          GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -m all >/dev/null
      - name: Verify runner architecture
        run: test "$(uname -m)" = x86_64
      - name: Format
        run: make fmt-check
      - name: Vet
        run: make lint
      # The race run already executes the ordinary unit, integration, and
      # schema tests, so do not run those suites a second time.
      - name: Tests
        run: make test-race
      - name: License gate
        run: make license-check
      - name: Build
        run: make build

  external:
    name: external-linux-amd64-claude
    needs: pure
    runs-on: ubuntu-latest
    env:
      GOARCH: amd64
      KORDN_EXTERNAL_REQUIRED: '1'
      KORDN_EXTERNAL_TESTS: '1'
      KORDN_BOTO_LONG_RUN: '1'
      KORDN_AGENT: claude
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false
      # Keep this job independent of the pure job's module-cache save.
      - name: Download Go modules
        run: |
          set -euxo pipefail
          GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go mod download
          GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org go list -m all >/dev/null
      - name: Install exact AWS CLI v2
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location "https://awscli.amazonaws.com/awscli-exe-linux-x86_64-${AWSCLI_VERSION}.zip" -o /tmp/aws.zip
          unzip -q /tmp/aws.zip -d /tmp/awscli
          sudo /tmp/awscli/aws/install --update
          aws --version | grep -F "${AWSCLI_VERSION}"
      - name: Install exact Terraform and provider mirror
        shell: bash
        run: |
          set -euxo pipefail
          tf_arch=amd64
          tf_os=linux
          curl --fail --location "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_${tf_os}_${tf_arch}.zip" -o /tmp/terraform.zip
          unzip -qo /tmp/terraform.zip -d /tmp/bin
          sudo install /tmp/bin/terraform /usr/local/bin/terraform
          terraform version | grep -F "v${TERRAFORM_VERSION}"
          mkdir -p "$RUNNER_TEMP/provider-mirror/registry.terraform.io/hashicorp/aws/${AWS_PROVIDER_VERSION}/${tf_os}_${tf_arch}"
          curl --fail --location "https://releases.hashicorp.com/terraform-provider-aws/${AWS_PROVIDER_VERSION}/terraform-provider-aws_${AWS_PROVIDER_VERSION}_${tf_os}_${tf_arch}.zip" -o /tmp/provider.zip
          unzip -qo /tmp/provider.zip -d "$RUNNER_TEMP/provider-mirror/registry.terraform.io/hashicorp/aws/${AWS_PROVIDER_VERSION}/${tf_os}_${tf_arch}"
          echo "KORDN_TERRAFORM_MIRROR=$RUNNER_TEMP/provider-mirror" >> "$GITHUB_ENV"
      - name: Install exact Python and boto
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python3 -m pip install "boto3==${BOTO3_VERSION}" "botocore==${BOTO3_VERSION}"
      - name: Verify boto versions and imports
        run: |
          python3 - <<'PY'
          import os

          import boto3
          import botocore

          expected = os.environ["BOTO3_VERSION"]
          assert boto3.__version__ == expected, boto3.__version__
          assert botocore.__version__ == expected, botocore.__version__
          PY
      - name: Install exact Claude producer
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_VERSION}"
          claude --version
      - name: Required external producer gate
        run: make test-external
