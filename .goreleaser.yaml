version: 2

project_name: kordn

before:
  hooks:
    - go mod verify

builds:
  - id: kordn
    main: ./cmd/kordn
    binary: kordn
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -buildid=
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    mod_timestamp: '1767225600'

archives:
  - id: kordn
    ids: [kordn]
    formats: [tar.gz]
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE
      - THIRD_PARTY_NOTICES.md
      - third_party/iamlive/LICENSE
      - third_party/iamlive/NOTICE
      - third_party/licenses/aws-sdk-v2/LICENSE
      - third_party/licenses/go-bsd-3-clause/LICENSE
      - third_party/licenses/go-yaml-v3/LICENSE
      - third_party/licenses/x-net/LICENSE
      - third_party/licenses/x-net/PATENTS
      - docs/quickstart.md
      - docs/threat-model.md

checksum:
  name_template: 'SHA256SUMS'
  algorithm: sha256

sboms:
  - id: kordn-sbom
    artifacts: archive
    cmd: syft
    args:
      - '${artifact}'
      - '--output'
      - 'cyclonedx-json=${document}'

snapshot:
  version_template: '{{ incpatch .Version }}-snapshot'

release:
  draft: true
  prerelease: auto
